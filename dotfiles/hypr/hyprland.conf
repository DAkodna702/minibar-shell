# Pantallas y espacios administrados desde Minibar.
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/keyboards.conf

# Iniciar el overview de Quickshell
exec-once = qs -c overview
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

general {
    gaps_in = 4
    gaps_out = 4
    border_size = 1
    layout = dwindle
}

input {
    kb_layout = latam
    numlock_by_default = true
    mouse_refocus = false
}

decoration {
    rounding = 12
    active_opacity = 0.95
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

animations {
    enabled = true
    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
}

dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

$mainMod = SUPER
$terminal = kitty
$fileManager = hyprfm
$navegador = brave
$menu = hyprlauncher

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, N, exec, $navegador
bind = $mainMod, space, exec, qs -c minibar ipc call minibarLauncher toggle
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# SUPER + clic izquierdo: mover; SUPER + clic derecho: redimensionar.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

exec-once = qs -c minibar
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Espacios 1-9 locales de la pantalla bajo el cursor.
$monitorWorkspace = ~/.config/quickshell/minibar/components/monitors/local-workspace.sh
bind = $mainMod, 1, exec, $monitorWorkspace switch 1
bind = $mainMod, 2, exec, $monitorWorkspace switch 2
bind = $mainMod, 3, exec, $monitorWorkspace switch 3
bind = $mainMod, 4, exec, $monitorWorkspace switch 4
bind = $mainMod, 5, exec, $monitorWorkspace switch 5
bind = $mainMod, 6, exec, $monitorWorkspace switch 6
bind = $mainMod, 7, exec, $monitorWorkspace switch 7
bind = $mainMod, 8, exec, $monitorWorkspace switch 8
bind = $mainMod, 9, exec, $monitorWorkspace switch 9

bind = $mainMod SHIFT, 1, exec, $monitorWorkspace move 1
bind = $mainMod SHIFT, 2, exec, $monitorWorkspace move 2
bind = $mainMod SHIFT, 3, exec, $monitorWorkspace move 3
bind = $mainMod SHIFT, 4, exec, $monitorWorkspace move 4
bind = $mainMod SHIFT, 5, exec, $monitorWorkspace move 5
bind = $mainMod SHIFT, 6, exec, $monitorWorkspace move 6
bind = $mainMod SHIFT, 7, exec, $monitorWorkspace move 7
bind = $mainMod SHIFT, 8, exec, $monitorWorkspace move 8
bind = $mainMod SHIFT, 9, exec, $monitorWorkspace move 9

bind = $mainMod CTRL, left, exec, $monitorWorkspace focus-monitor left
bind = $mainMod CTRL, right, exec, $monitorWorkspace focus-monitor right
bind = $mainMod CTRL SHIFT, left, exec, $monitorWorkspace move-monitor left
bind = $mainMod CTRL SHIFT, right, exec, $monitorWorkspace move-monitor right

# Abrir y cerrar el overview con Windows + Tab.
bind = SUPER, TAB, exec, qs ipc -c overview call overview toggle

# Capturas de pantalla
bind = , Print, exec, grim -g "$(slurp)" - | satty --filename - --output-filename "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png"
bind = SHIFT, Print, exec, grim "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png"
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | satty --filename - --output-filename "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png"
bind = SUPER CTRL, S, exec, grim - | wl-copy

# Grabación de pantalla
bind = SUPER SHIFT, R, exec, pkill -INT wf-recorder || wf-recorder -f "$HOME/Videos/Recordings/$(date +'%Y-%m-%d_%H-%M-%S').mp4"
bind = SUPER ALT, R, exec, pkill -INT wf-recorder || wf-recorder -a -f "$HOME/Videos/Recordings/$(date +'%Y-%m-%d_%H-%M-%S').mp4"
bind = SUPER CTRL, R, exec, pkill -INT wf-recorder || wf-recorder -g "$(slurp)" -f "$HOME/Videos/Recordings/$(date +'%Y-%m-%d_%H-%M-%S').mp4"

